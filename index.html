<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Ewidencja VAT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Ewidencja przebiegu pojazdu VAT</h1>

<div class="form">
    <input type="month" id="month">
    <input type="text" id="name" placeholder="Imię i nazwisko">
    <input type="text" id="plate" placeholder="Rejestracja">
    <input type="number" id="startKm" placeholder="Stan początkowy">
    <input type="number" id="kmPerDay" value="54">
    <label><input type="checkbox" id="skipWeekends" checked> Pomijaj weekendy</label>

    <button onclick="generate()">Generuj</button>
    <button onclick="downloadPDF()">PDF</button>
</div>

<div id="pages"></div>

<datalist id="routesList"></datalist>

<script src="https://cdn.jsdelivr.net/npm/html2pdf.js"></script>
<script src="app.js"></script>

</body>
</html>
