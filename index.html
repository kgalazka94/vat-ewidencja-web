<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Ewidencja VAT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form">
    <input type="month" id="month">
    <input type="text" id="name" placeholder="Imię i nazwisko">
    <input type="text" id="plate" placeholder="Rejestracja">
    <input type="number" id="startKm" placeholder="Stan początkowy">

    <label><input type="checkbox" id="skipWeekends" checked> weekendy</label>
    <label><input type="checkbox" id="skipHolidays" checked> święta</label>

    <button onclick="generate()">Generuj</button>
    <button onclick="downloadPDF()">PDF</button>
</div>

<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
